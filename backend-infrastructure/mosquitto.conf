# FloodGate: MQTT Broker Configuration
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# TCP Listener (ESP32 devices)
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket Listener (Dashboard, future)
listener 9001
protocol websockets
allow_anonymous true

# FloodGate: ACL Settings (for future production)
# Uncomment when implementing authentication:
# allow_anonymous false
# acl_file /mosquitto/config/aclfile.txt
# password_file /mosquitto/config/pwdfile.txt
